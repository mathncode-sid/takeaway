<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Takeaway — Speaker Upload</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container" style="max-width:900px; margin:3rem auto;">
    <header style="text-align:center; margin-bottom:2rem;">
      <h1>Takeaway — Speaker Upload</h1>
      <p style="color:var(--muted-foreground)">Upload presentation materials (PDF/PPT/Video). No login required.</p>
    </header>

    <main>
      <div class="card" style="padding:1.5rem;">
        <label for="fileInput" style="display:block; margin-bottom:0.5rem; font-weight:600">Select file</label>
        <input id="fileInput" type="file" accept=".pdf,.ppt,.pptx,.mp4,.avi,.mov,.wmv" />

        <div style="margin-top:1rem; display:flex; gap:1rem; align-items:center;">
          <button id="uploadBtn" class="btn btn-primary" disabled>Upload</button>
          <button id="backBtn" class="btn btn-secondary">Back</button>
        </div>

        <div id="progressContainer" style="margin-top:1rem; display:none;">
          <div style="background:#eee; height:10px; border-radius:6px; overflow:hidden;">
            <div id="progressBar" style="height:10px; width:0%; background:var(--primary);"></div>
          </div>
          <div id="progressText" style="margin-top:0.5rem; color:var(--muted-foreground)"></div>
        </div>

        <div id="result" style="margin-top:1rem; display:none;"></div>
      </div>

      <div style="margin-top:2rem; text-align:center;">
        <a href="/" class="btn">Return to Home</a>
      </div>
    </main>
  </div>

  <script src="speaker.js"></script>
</body>
</html>
