<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Takeaway — Speaker Upload</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container" style="max-width:900px; margin:3rem auto;">
    <header style="text-align:center; margin-bottom:2rem;">
      <h1>Takeaway — Speaker Upload</h1>
      <p style="color:var(--muted-foreground)">Upload presentation materials (PDF/PPT/Video). No login required.</p>
    </header>

    <main>
      <div class="card" style="padding:1.5rem;">
        <label for="fileInput" style="display:block; margin-bottom:0.5rem; font-weight:600">Select file</label>
        <input id="fileInput" type="file" accept=".pdf,.ppt,.pptx,.mp4,.avi,.mov,.wmv" />

        <div style="margin-top:1rem; display:flex; gap:1rem; align-items:center;">
          <button id="uploadBtn" class="btn btn-primary" disabled>Upload</button>
          <button id="backBtn" class="btn btn-secondary">Back</button>
        </div>
        
          <hr style="margin:18px 0;" />
        
          <h3>Event shareable link</h3>
          <p class="muted">Create or view the public event link that attendees can use.</p>
          <div id="shareableCard" style="margin-top:12px">
            <input id="shareableLinkInput" type="text" readonly style="width:100%; padding:8px;" placeholder="No shareable link yet" />
            <div style="margin-top:8px; display:flex; gap:8px;">
              <button id="generateLinkBtn" class="btn">Generate shareable link</button>
              <button id="copyLinkBtn" class="btn btn--muted">Copy link</button>
            </div>
          </div>

        <div id="progressContainer" style="margin-top:1rem; display:none;">
          <div style="background:#eee; height:10px; border-radius:6px; overflow:hidden;">
            <div id="progressBar" style="height:10px; width:0%; background:var(--primary);"></div>
          </div>
          <div id="progressText" style="margin-top:0.5rem; color:var(--muted-foreground)"></div>
        </div>

        <div id="result" style="margin-top:1rem; display:none;"></div>
        
        <hr style="margin:18px 0;" />

        <h3>Uploaded files</h3>
        <p class="muted">Files uploaded for this event. Click to open.</p>
        <div id="filesContainer" style="margin-top:12px">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>Files</strong>
            <button id="refreshFilesBtn" class="btn btn--muted">Refresh</button>
          </div>
          <div id="filesList" style="margin-top:8px;"></div>
        </div>
      </div>

      <div style="margin-top:2rem; text-align:center;">
        <a href="/" class="btn">Return to Home</a>
      </div>
    </main>
  </div>

  <script src="speaker.js"></script>
</body>
</html>
